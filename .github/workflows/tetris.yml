name: Update GitHub Tetris

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate live SVG files into generated
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          python scripts/generate_tetris.py

      - name: Publish generated files to visual branch only if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf .visual

          if git ls-remote --exit-code --heads "${REPO_URL}" visual > /dev/null 2>&1; then
            git clone --depth 1 --branch visual "${REPO_URL}" .visual
          else
            mkdir .visual
            cd .visual
            git init
            git checkout -b visual
            git remote add origin "${REPO_URL}"
            cd ..
          fi

          find .visual -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R generated/. .visual/

          cd .visual
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No visual changes. Skip commit."
            exit 0
          fi

          git commit -m "Deploy GitHub Tetris"
          git push origin visual
